name: Release TV

# Push a version tag such as v5.9.2 to publish an official leanback (TV) release.
# Required Actions secrets:
#   SIGNING_STORE_BASE64              base64 of the release keystore (.jks / .keystore)
#   SIGNING_STORE_PASSWORD            keystore password
#   SIGNING_KEY_ALIAS                 key alias
#   SIGNING_KEY_PASSWORD              optional; defaults to SIGNING_STORE_PASSWORD
#   LIB_MPVPLAYER_RELEASE_AAR_BASE64  base64 of app/libs/lib-mpvplayer-release.aar
#   LIB_DECODER_FFMPEG_RELEASE_AAR_BASE64  base64 of app/libs/lib-decoder-ffmpeg-release.aar
# Encode a file with: base64 -w0 path/to/file

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish TV release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          LIB_MPVPLAYER_RELEASE_AAR_BASE64: ${{ secrets.LIB_MPVPLAYER_RELEASE_AAR_BASE64 }}
          LIB_DECODER_FFMPEG_RELEASE_AAR_BASE64: ${{ secrets.LIB_DECODER_FFMPEG_RELEASE_AAR_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in SIGNING_STORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS LIB_MPVPLAYER_RELEASE_AAR_BASE64 LIB_DECODER_FFMPEG_RELEASE_AAR_BASE64; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add them under Settings > Secrets and variables > Actions, then push the tag again."
            exit 1
          fi

      - name: Set version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Tag '$TAG' is not a version tag like v5.9.2"
            exit 1
          fi
          CODE="${VERSION//./}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          sed -i -E "s/versionName \".*\"/versionName \"${VERSION}\"/" app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${CODE}/" app/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare signing key and native libraries
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          LIB_MPVPLAYER_RELEASE_AAR_BASE64: ${{ secrets.LIB_MPVPLAYER_RELEASE_AAR_BASE64 }}
          LIB_DECODER_FFMPEG_RELEASE_AAR_BASE64: ${{ secrets.LIB_DECODER_FFMPEG_RELEASE_AAR_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, sys
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])

          def write_secret(name, dest):
              raw = os.environ[name].strip()
              data = base64.b64decode(raw, validate=False)
              if not data:
                  sys.exit(f"{name} decoded to an empty file")
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              print(f"Wrote {dest.relative_to(root)} ({len(data)} bytes)")

          write_secret("SIGNING_STORE_BASE64", root / "signing.jks")
          write_secret("LIB_MPVPLAYER_RELEASE_AAR_BASE64", root / "app/libs/lib-mpvplayer-release.aar")
          write_secret("LIB_DECODER_FFMPEG_RELEASE_AAR_BASE64", root / "app/libs/lib-decoder-ffmpeg-release.aar")

          sdk = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT")
          if not sdk:
              sys.exit("ANDROID_HOME is not set")
          alias = os.environ["SIGNING_KEY_ALIAS"]
          store_password = os.environ["SIGNING_STORE_PASSWORD"]
          key_password = os.environ.get("SIGNING_KEY_PASSWORD") or store_password
          props = (
              f"sdk.dir={sdk}\n"
              f"storeFile={root / 'signing.jks'}\n"
              f"keyAlias={alias}\n"
              f"storePassword={store_password}\n"
              f"keyPassword={key_password}\n"
          )
          (root / "local.properties").write_text(props, encoding="utf-8")
          PY

      - name: Build TV release APKs
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleLeanbackRelease exportLeanbackReleaseApks --no-daemon --stacktrace

      - name: Publish official GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          arm64="Release/apk/leanback-arm64_v8a.apk"
          arm32="Release/apk/leanback-armeabi_v7a.apk"
          for apk in "$arm64" "$arm32"; do
            if [ ! -f "$apk" ]; then
              echo "Missing expected APK: $apk"
              find Release/apk -type f -name '*.apk' -print || true
              exit 1
            fi
          done
          gh release create "$TAG" "$arm64" "$arm32" \
            --title "$VERSION" \
            --latest \
            --generate-notes

      - name: Remove signing material
        if: always()
        run: |
          rm -f signing.jks local.properties \
            app/libs/lib-mpvplayer-release.aar \
            app/libs/lib-decoder-ffmpeg-release.aar
